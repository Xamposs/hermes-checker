name: hermes-checker
version: 0.2.0
description: >
  Local, non-invasive observability for Hermes Agent / Hermes Desktop.
  Records per-API-call token usage, per-tool-call profiling, and
  prompt-component attribution into a local SQLite database. Exposes a
  small dashboard and CLI. Does not modify prompts, responses, or
  routing.
author: Xamposs
license: MIT
homepage: https://github.com/Xamposs/hermes-checker
tags:
  - observability
  - profiler
  - tokens
  - analytics
hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - on_skill_lifecycle
  - subagent_start
  - subagent_stop
  # Hermes also offers pre_llm_call / post_llm_call as a per-turn backup
  # correlation signal. We register passive observers; they never
  # return context to inject.
  - pre_llm_call
  - post_llm_call
kind: standalone
manifest_version: 1
capabilities: []
emits: []
listens: []
python_dependencies: []
config_schema: {}
