# Hermes Checker — pricing example
#
# This file shows the YAML schema Hermes Checker understands. Pricing
# profiles are *user-editable*. Do not hardcode provider prices into
# code — keep them here so we can rerun cost projections later.
#
# All rates are USD per 1 000 000 tokens unless noted. Missing fields
# default to 0 (that token bucket contributes $0 to projected cost).
#
# Hermes Checker ships zero defaults; if a model is missing here, cost
# projections for it return None (the report UI shows "no profile").
#
# `notes` is free-form and rendered in the CLI report.

profiles:
  - name: openrouter-2026-09
    notes: >
      Snapshot of OpenRouter public pricing as of 2026-09. Edit as prices
      change; Hermes Checker never reads the network.
    models:
      deepseek/deepseek-chat-v4-flash:
        input_per_million_usd: 0.27
        cached_input_per_million_usd: 0.07
        output_per_million_usd: 1.10
      deepseek/deepseek-chat:
        input_per_million_usd: 0.27
        cached_input_per_million_usd: 0.07
        output_per_million_usd: 1.10
      anthropic/claude-sonnet-4:
        input_per_million_usd: 3.00
        cached_input_per_million_usd: 0.30
        output_per_million_usd: 15.00
      anthropic/claude-3.5-sonnet:
        input_per_million_usd: 3.00
        cached_input_per_million_usd: 0.30
        output_per_million_usd: 15.00
      openai/gpt-4o:
        input_per_million_usd: 2.50
        cached_input_per_million_usd: 1.25
        output_per_million_usd: 10.00
      openai/gpt-5-mini:
        input_per_million_usd: 0.25
        cached_input_per_million_usd: 0.025
        output_per_million_usd: 2.00

  - name: baseline-minimax-m3-free
    notes: >
      Free direct baseline through OpenCode. All rates 0; useful as a
      "what is everything costing on the current free model?" sanity
      check during A/B experiments.
    models:
      opencode/minimax-m3:
        input_per_million_usd: 0.0
        cached_input_per_million_usd: 0.0
        output_per_million_usd: 0.0
      opencode/minimax-*: {}

  - name: omniroute-rtk
    notes: >
      Placeholder for OmniRoute routing experiments. Leave values blank
      for now — fill in once routing experiments begin.
    models: {}